title = "porch gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholder token shapes in docs; gitignored local run artefacts (never committed)"
paths = [
  '''test/conformance/\.(work|build)/''',
  '''deploy/(demo/)?\.(state|dev)/''',
  '''(^|/)node_modules/''',
  '''^bin/''',
  '''(^|/)\.claude/''',
]
regexes = [
  '''porch_at_EXAMPLE[A-Za-z0-9_]*''',
  '''porch_setup_EXAMPLE[A-Za-z0-9_]*''',
]
